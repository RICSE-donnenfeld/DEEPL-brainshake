name: Build Report

on:
  push:
    paths:
      - "latex/main.tex"
      - "out/mermaid/**"
      - "out/plots/**"
      - "out/data_analyze/**"
    paths-ignore:
      - "latex/main.pdf"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: latex
          args: -pdf -file-line-error -interaction=nonstopmode

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: report-pdf
          path: latex/main.pdf

      - name: Commit PDF back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f latex/main.pdf
          git diff --cached --quiet || git commit -m "ci: build report PDF"
          git pull --rebase
          git push